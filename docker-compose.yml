services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - db
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=youssef
      - POSTGRES_PASSWORD=youssef
      - POSTGRES_DB=my-db
    ports:
      - "5432:5432"
  